name: Test NeoJAMS (Python 3.12+ only)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Only testing Python 3.12 and 3.13 as per requirements
    strategy:
      matrix:
        python-version: ["3.12", "3.13-dev"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    # Using Poetry for dependency management instead of pip
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Install dependencies with Poetry
      run: |
        poetry install --with dev
        
    - name: Run tests with Poetry
      run: |
        poetry run pytest
        
    - name: Run linting with Poetry
      run: |
        poetry run ruff check neojams tests examples
        
    - name: Check formatting with Poetry
      run: |
        poetry run black --check neojams tests examples 